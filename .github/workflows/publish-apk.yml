name: Publish verified APK
on:
  push:
    branches: [main]
    paths: [.apk-upload/manifest.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: svin-apk-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APK_REPOSITORY: ${{ github.repository }}
      APK_COMMIT: ${{ github.sha }}
    steps:
      - name: Assemble and verify APK, then publish release
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, time, urllib.request, urllib.error
          from pathlib import Path
          repository = os.environ['APK_REPOSITORY']
          commit = os.environ['APK_COMMIT']
          api = 'https://api.github.com/repos/' + repository
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github.raw+json',
                     'User-Agent': 'Svin-APK-release'}
          def fetch(path):
              for attempt in range(4):
                  try:
                      return urllib.request.urlopen(urllib.request.Request(api + path, headers=headers), timeout=180)
                  except (urllib.error.HTTPError, urllib.error.URLError) as error:
                      if isinstance(error, urllib.error.HTTPError) and error.code not in (429,500,502,503,504):
                          raise
                      if attempt == 3: raise
                      time.sleep(5 * (attempt + 1))
          with fetch('/contents/.apk-upload/manifest.json?ref=' + commit) as response:
              manifest = json.load(response)
          assert re.fullmatch(r'[A-Za-z0-9_.-]+\.apk', manifest['file_name'])
          assert re.fullmatch(r'[0-9a-f]{64}', manifest['sha256'])
          assert 0 < manifest['size'] < 2 * 1024**3
          assert 1 <= len(manifest['parts']) <= 1024
          output = Path(manifest['file_name'])
          total = hashlib.sha256()
          size = 0
          with output.open('wb') as target:
              for index, part in enumerate(manifest['parts']):
                  assert part['index'] == index
                  assert re.fullmatch(r'[0-9a-f]{40}', part['git_blob_sha'])
                  digest = hashlib.sha256()
                  part_size = 0
                  with fetch('/git/blobs/' + part['git_blob_sha']) as response:
                      while block := response.read(1024*1024):
                          target.write(block)
                          total.update(block); digest.update(block)
                          size += len(block); part_size += len(block)
                  assert part_size == part['size'], 'Part size mismatch'
                  assert digest.hexdigest() == part['sha256'], 'Part hash mismatch'
                  print('Verified part', index + 1, '/', len(manifest['parts']), flush=True)
          assert size == manifest['size'], 'APK size mismatch'
          assert total.hexdigest() == manifest['sha256'], 'APK hash mismatch'
          tag = manifest['tag']
          assert re.fullmatch(r'[A-Za-z0-9_.-]+', tag)
          notes = Path('release-notes.txt')
          notes.write_text(manifest['release_notes'], encoding='utf-8')
          def gh(*args):
              result = subprocess.run(['gh', *args], check=True, text=True, capture_output=True)
              return result.stdout
          releases = json.loads(gh('api', f'repos/{repository}/releases?per_page=100'))
          matches = [r for r in releases if r['tag_name'] == tag]
          assert not matches, 'Release already exists; refusing to overwrite'
          gh('release','create',tag,'--repo',repository,'--target',commit,
             '--title',manifest['release_title'],'--notes-file',str(notes),'--prerelease','--draft')
          gh('release','upload',tag,str(output),'--repo',repository)
          releases = json.loads(gh('api', f'repos/{repository}/releases?per_page=100'))
          release = next(r for r in releases if r['tag_name'] == tag)
          assets = [a for a in release['assets'] if a['name'] == output.name]
          assert len(assets) == 1
          asset = assets[0]
          assert asset['state'] == 'uploaded' and asset['size'] == size
          assert asset.get('digest') == 'sha256:' + manifest['sha256'], 'Uploaded asset hash mismatch'
          gh('release','edit',tag,'--repo',repository,'--draft=false','--prerelease')
          release = json.loads(gh('api', f'repos/{repository}/releases/{release["id"]}'))
          assert not release['draft']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as summary:
              summary.write(f'APK: [{output.name}]({asset["browser_download_url"]})\n\n')
              summary.write(f'SHA-256: {manifest["sha256"]}\n')
          print('Published:', release['html_url'], flush=True)
          PY
