name: Publish My Flying Pig APK

on:
  push:
    branches: [main]
    paths: [.apk-upload/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: my-flying-pig-apk-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APK_REPOSITORY: ${{ github.repository }}
      APK_COMMIT: ${{ github.sha }}
    steps:
      - name: Assemble, verify, and publish the APK
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          repository = os.environ['APK_REPOSITORY']
          commit = os.environ['APK_COMMIT']
          api = 'https://api.github.com/repos/' + repository
          expected_name = 'MyFlyingPig-700304.4.apk'
          expected_size = 526976962
          expected_sha = '5dbbf7b807a6950122cc2b452f1cb604ef6718ac21cae0df36c9dc69d9c15a8e'
          tag = '700304.4-local'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github.raw+json',
              'User-Agent': 'Svin-APK-publisher',
          }

          def fetch(path):
              request = urllib.request.Request(api + path, headers=headers)
              for attempt in range(3):
                  try:
                      return urllib.request.urlopen(request, timeout=180)
                  except urllib.error.HTTPError as error:
                      if error.code not in (429, 500, 502, 503, 504) or attempt == 2:
                          raise
                      time.sleep(5 * (attempt + 1))
                  except urllib.error.URLError:
                      if attempt == 2:
                          raise
                      time.sleep(5 * (attempt + 1))

          with fetch('/contents/.apk-upload/manifest.json?ref=' + commit) as response:
              manifest = json.load(response)
          assert manifest['file_name'] == expected_name, 'Unexpected file name'
          assert manifest['size'] == expected_size, 'Unexpected file size'
          assert manifest['sha256'] == expected_sha, 'Unexpected file digest'
          parts = manifest['parts']
          assert 1 <= len(parts) <= 1024, 'Invalid part count'
          output = Path(expected_name)
          total_hash = hashlib.sha256()
          total_size = 0
          with output.open('wb') as destination:
              for index, part in enumerate(parts):
                  assert part['index'] == index, 'Incorrect part order'
                  blob = part['git_blob_sha']
                  assert re.fullmatch(r'[0-9a-f]{40}', blob), 'Invalid blob SHA'
                  part_hash = hashlib.sha256()
                  part_size = 0
                  with fetch('/git/blobs/' + blob) as response:
                      while True:
                          block = response.read(1024 * 1024)
                          if not block:
                              break
                          destination.write(block)
                          total_hash.update(block)
                          part_hash.update(block)
                          total_size += len(block)
                          part_size += len(block)
                  assert part_size == part['size'], 'Part size mismatch'
                  assert part_hash.hexdigest() == part['sha256'], 'Part digest mismatch'
                  print(f'Part {index + 1}/{len(parts)} verified', flush=True)
          assert total_size == expected_size, 'APK size mismatch'
          assert total_hash.hexdigest() == expected_sha, 'APK SHA-256 mismatch'
          print('Complete APK SHA-256 verified: ' + expected_sha, flush=True)

          notes = Path('release-notes.txt')
          notes.write_text(
              'Единый APK My Flying Pig 700304.4 для Android ARM64.\n\n'
              'Включены локальные изменения валюты и рекламы и ресурсы всех трёх исходных APK. '
              'Часть дополнительных локаций может требовать интернет.\n\n'
              'Запуск на Android и загрузка всех локаций ещё не проверялись. '
              'Проверены структура архива, подпись и целостность данных.\n\n'
              'Подпись отличается от версии Google Play. Удаление оригинальной игры может стереть прогресс.\n\n'
              f'Размер: {expected_size} байт\nSHA-256: {expected_sha}\n',
              encoding='utf-8',
          )

          def gh(*arguments):
              return subprocess.run(['gh', *arguments], check=True, text=True, capture_output=True).stdout

          releases = json.loads(gh('api', f'repos/{repository}/releases?per_page=100'))
          matching_releases = [release for release in releases if release['tag_name'] == tag]
          assert len(matching_releases) <= 1, 'More than one matching release'
          if matching_releases:
              release = matching_releases[0]
          else:
              gh('release', 'create', tag, '--repo', repository, '--target', commit,
                 '--title', 'My Flying Pig 700304.4 — единый APK',
                 '--notes-file', str(notes), '--prerelease', '--draft')
              releases = json.loads(gh('api', f'repos/{repository}/releases?per_page=100'))
              matching_releases = [release for release in releases if release['tag_name'] == tag]
              assert len(matching_releases) == 1, 'Draft release was not found'
              release = matching_releases[0]
          release_path = f'repos/{repository}/releases/{release["id"]}'

          matches = [asset for asset in release['assets'] if asset['name'] == expected_name]
          if not matches:
              gh('release', 'upload', tag, str(output), '--repo', repository)
              release = json.loads(gh('api', release_path))
              matches = [asset for asset in release['assets'] if asset['name'] == expected_name]
          assert len(matches) == 1, 'Release asset was not found'
          asset = matches[0]
          assert asset['state'] == 'uploaded', 'Incomplete release asset'
          assert asset['size'] == expected_size, 'Release asset size mismatch'
          if asset.get('digest'):
              assert asset['digest'] == 'sha256:' + expected_sha, 'Release asset digest mismatch'

          gh('release', 'edit', tag, '--repo', repository, '--draft=false', '--prerelease')
          release = json.loads(gh('api', release_path))
          assert not release['draft'], 'Release is still a draft'
          print('Published: ' + release['html_url'], flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'## APK опубликован\n\n[Скачать {expected_name}]({asset["browser_download_url"]})\n\n')
              summary.write(f'Размер: {expected_size} байт.\n\nSHA-256: `{expected_sha}`\n')
          PY
